name: Repository validation

on:
  push:
    branches: [main]
    paths:
      - "README*.md"
      - "LICENSE"
      - "Dockerfile"
      - "settings.yml"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "scripts/**"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "README*.md"
      - "LICENSE"
      - "Dockerfile"
      - "settings.yml"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "scripts/**"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment template and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration and license scope
        run: python scripts/validate_repo.py
      - name: Check documentation links, anchors, and SVGs
        run: python scripts/check_docs.py
      - name: Check secret generator shell syntax
        run: sh -n scripts/generate-secret.sh
