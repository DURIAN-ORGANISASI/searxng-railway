<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">SearXNG Railway architecture</title>
  <desc id="desc">n8n reaches SearXNG over Railway private networking; SearXNG queries external search engines.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101722"/><stop offset="1" stop-color="#182B38"/></linearGradient></defs>
  <rect width="1000" height="470" rx="24" fill="url(#bg)"/>
  <text x="40" y="52" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">Service architecture</text>
  <rect x="35" y="85" width="620" height="335" rx="18" fill="#0B1220" stroke="#43E6C3" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="58" y="118" fill="#43E6C3" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">RAILWAY · SAME PROJECT + ENVIRONMENT</text>
  <rect x="70" y="166" width="225" height="110" rx="14" fill="#182C3A" stroke="#43E6C3"/>
  <text x="182" y="204" text-anchor="middle" fill="#43E6C3" font-family="Inter,Segoe UI,sans-serif" font-size="14">WORKFLOW CLIENT</text>
  <text x="182" y="238" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">n8n</text>
  <path d="M310 221H381" stroke="#63A4FF" stroke-width="4"/><path d="m370 210 12 11-12 11" fill="none" stroke="#63A4FF" stroke-width="4"/>
  <text x="347" y="195" text-anchor="middle" fill="#A9BED0" font-family="Inter,Segoe UI,sans-serif" font-size="12">HTTP / JSON</text>
  <rect x="397" y="166" width="225" height="110" rx="14" fill="#182C3A" stroke="#63A4FF"/>
  <text x="509" y="201" text-anchor="middle" fill="#63A4FF" font-family="Inter,Segoe UI,sans-serif" font-size="14">PORT 8080</text>
  <text x="509" y="236" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">SearXNG</text>
  <text x="509" y="258" text-anchor="middle" fill="#A9BED0" font-family="Inter,Segoe UI,sans-serif" font-size="13">JSON enabled</text>
  <text x="58" y="330" fill="#C8D5E2" font-family="Inter,Segoe UI,sans-serif" font-size="15">Internal address:</text>
  <text x="58" y="358" fill="#F8FAFC" font-family="ui-monospace,Consolas,monospace" font-size="17">searxng.railway.internal</text>
  <text x="58" y="390" fill="#93A4B5" font-family="Inter,Segoe UI,sans-serif" font-size="13">No public domain required for n8n access</text>
  <path d="M622 221H711" stroke="#F5B942" stroke-width="4"/><path d="m700 210 12 11-12 11" fill="none" stroke="#F5B942" stroke-width="4"/>
  <text x="666" y="195" text-anchor="middle" fill="#F5B942" font-family="Inter,Segoe UI,sans-serif" font-size="12">outbound</text>
  <rect x="729" y="166" width="235" height="110" rx="14" fill="#2A2630" stroke="#F5B942"/>
  <text x="846" y="204" text-anchor="middle" fill="#F5B942" font-family="Inter,Segoe UI,sans-serif" font-size="14">EXTERNAL SOURCES</text>
  <text x="846" y="237" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Search engines</text>
  <text x="846" y="258" text-anchor="middle" fill="#C8D5E2" font-family="Inter,Segoe UI,sans-serif" font-size="13">availability varies</text>
  <text x="729" y="330" fill="#FCA5A5" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Security boundary</text>
  <text x="729" y="355" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="13">No auth/rate limiting</text>
  <text x="729" y="376" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="13">on this template's API.</text>
  <text x="729" y="397" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="13">Keep the service private.</text>
</svg>
