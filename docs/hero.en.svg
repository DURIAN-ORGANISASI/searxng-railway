  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><circle cx="1020" cy="58" r="150" fill="#43E6C3" opacity=".07"/><circle cx="120" cy="325" r="180" fill="#63A4FF" opacity=".06"/>
  <text x="56" y="70" fill="#C8D5E2" font-family="Inter,Segoe UI,sans-serif" font-size="16" letter-spacing="3">PRIVATE SEARCH STACK</text>
  <text x="56" y="125" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="36" font-weight="700">Private search for AI workflows</text><text x="56" y="158" fill="#9FB0C1" font-family="Inter,Segoe UI,sans-serif" font-size="17">SearXNG + Railway Private Networking + n8n</text>
  <rect x="56" y="210" width="1088" height="104" rx="18" fill="#0B1220" stroke="#344456"/>
  <rect x="80" y="229" width="250" height="66" rx="12" fill="#182C3A" stroke="#43E6C3"/><text x="205" y="256" fill="#43E6C3" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="middle">SERVICE</text><text x="205" y="280" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">n8n</text>
