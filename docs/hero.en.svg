<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SearXNG Railway for n8n</title><desc id="desc">A private SearXNG service connects to n8n over Railway private networking and sends queries to external search engines.</desc>
